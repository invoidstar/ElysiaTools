name: Build and deploy ElysiaTools

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate academic data
        run: npm run validate
      - name: Verify offline journal audit utility
        run: python3 -m py_compile scripts/sync/audit_metric_csv.py
      - name: Source monitor state-machine regression tests
        run: python3 -m unittest discover -s tests -p 'source_health_test.py'
      - name: Run data tests
        run: npm test
      - name: Download pinned journal data sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/journal-metrics
          BASE='https://raw.githubusercontent.com/hitfyd/ShowJCR/4687a8f608f20aaf004299992f5d347dba009361/%E4%B8%AD%E7%A7%91%E9%99%A2%E5%88%86%E5%8C%BA%E8%A1%A8%E5%8F%8AJCR%E5%8E%9F%E5%A7%8B%E6%95%B0%E6%8D%AE%E6%96%87%E4%BB%B6'
          for FILE in FQBJCR2025-UTF8.csv XR2026-UTF8.csv JCR2025-UTF8.csv; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              "$BASE/$FILE" -o ".cache/journal-metrics/$FILE"
          done
      - name: Generate searchable complete journal index
        run: node scripts/sync/build_journal_universe.mjs .cache/journal-metrics public/data/journal-universe.json
      - name: Restore offline OpenAlex source cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/journal-websites/openalex-sites.json
            .cache/journal-websites/doaj-sites.json
          key: journal-homepages-openalex-q3-2026-v2
          save-always: true
      - name: Build all-journal website index from published reference data
        run: python3 scripts/sync/enrich_journal_websites.py
      - name: Download pinned conference website directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/ccfddl
          curl --fail --silent --show-error --location --retry 3 \
            'https://codeload.github.com/ccfddl/ccf-deadlines/tar.gz/7ceb4f4f9545c041d66467b456cd9a4a9166251f' \
            -o .cache/ccfddl/snapshot.tgz
          mkdir -p .cache/ccfddl/src
          tar -xzf .cache/ccfddl/snapshot.tgz -C .cache/ccfddl/src --strip-components=1
      - name: Build all-conference website directory
        shell: bash
        run: |
          python3 -m venv .cache/ccfddl/python
          .cache/ccfddl/python/bin/pip install --quiet PyYAML==6.0.2
          .cache/ccfddl/python/bin/python scripts/sync/build_conference_sites.py \
            --upstream-dir .cache/ccfddl/src
      - name: Validate retained journal index and per-journal diagnostics
        run: node scripts/sync/validate_journal_universe.mjs
      - name: Typecheck and build
        run: npm run build
      - name: Prepare GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
