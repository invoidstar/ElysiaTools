name: Official source health checks

on:
  schedule:
    - cron: '14 03 * * *'
    - cron: '37 03 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate structured data
        run: node scripts/validate.mjs
      - name: Check official source URLs (without rewriting deadlines)
        run: python3 scripts/sync/check_sources.py --output source-health-report.json
      - name: Upload source check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-report
          path: source-health-report.json
          if-no-files-found: warn
