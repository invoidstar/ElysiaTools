name: Official source health checks

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/sync/check_sources.py'
      - 'scripts/sync/report_source_changes.py'
      - '.github/workflows/source-health.yml'
  schedule:
    - cron: '14 03 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: elysiatools-official-sources-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate structured data
        run: node scripts/validate.mjs
      - name: Test source-health state machine and issue plan
        run: python3 -m unittest discover -s tests -p 'source_health_test.py'
      - name: Restore successful observations
        uses: actions/cache/restore@v4
        with:
          path: .cache/source-health/previous.json
          key: source-health-v3-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-health-v3-main-
      - name: Compare verified official sources
        run: |
          python3 scripts/sync/check_sources.py --baseline .cache/source-health/previous.json \
            --snapshot .cache/source-health/current.json \
            --output source-health-report.json --markdown source-health-report.md
          cat source-health-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or append independent review Issues
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync/report_source_changes.py source-health-report.json
      - name: Copy latest successful observations
        if: always()
        run: |
          if [ -s .cache/source-health/current.json ]; then
            cp .cache/source-health/current.json .cache/source-health/previous.json
          fi
      - name: Save successful fingerprints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/source-health/previous.json
          key: source-health-v3-main-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-report
          path: |
            source-health-report.json
            source-health-report.md
          if-no-files-found: warn
