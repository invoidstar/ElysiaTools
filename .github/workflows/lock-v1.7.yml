name: One-time V1.7 dependency lock generation

on:
  push:
    branches: [feat/elysiatools-v1.7-quality]

permissions:
  contents: write

jobs:
  create-lock:
    if: "!contains(github.event.head_commit.message, '[lock-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/elysiatools-v1.7-quality
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lock and current source
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit reproducible lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: commit npm dependency lock [lock-generated]"
            git push origin HEAD:refs/heads/feat/elysiatools-v1.7-quality
          fi
